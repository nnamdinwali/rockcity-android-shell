plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rockcity.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.rockcity.app"
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "1.0.1"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH")
            def ksPass = System.getenv("KEYSTORE_PASSWORD")
            def kAlias = System.getenv("KEY_ALIAS")
            def kPass = System.getenv("KEY_PASSWORD")
            if (ksPath != null && !ksPath.isEmpty() && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword ksPass ?: ""
                keyAlias kAlias ?: ""
                keyPassword kPass ?: ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Use release keystore when present; otherwise debug so CI can still build
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE']
        }
    }
}

configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
